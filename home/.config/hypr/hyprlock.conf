background {
    monitor =
    color = rgba(0, 0, 0, 1.0)
}

general { 
  ignore_empty_input = true
  no_fade_in = true
}

animations {
  enabled = false
}

# clock, top centre
label {
    monitor =
    text = cmd[update:1000] date '+%A %d.%m.%Y | %H:%M'
    color = rgb(ffffff)
    font_size = 14
    font_family = Terminus (TTF)
    position = 0, -20
    halign = center
    valign = top
}

# the box
shape {
    monitor =
    size = 460, 110
    color = rgba(0, 0, 0, 0)
    rounding = 0
    border_size = 1
    border_color = rgb(ffffff)
    position = 0, 0
    halign = center
    valign = center
}

label {
    monitor =
    text = Username:
    color = rgb(ffffff)
    font_size = 14
    font_family = Terminus (TTF)
    position = -150, 18
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    color = rgb(ffffff)
    font_size = 14
    font_family = Terminus (TTF)
    position = -50, 18
    halign = center
    valign = center
}

label {
    monitor =
    text = Password:
    color = rgb(ffffff)
    font_size = 14
    font_family = Terminus (TTF)
    position = -150, -18
    halign = center
    valign = center
}

input-field {
    outer_color = rgb(000000)
    check_color = rgb(000000)
    fail_color = rgb(000000)
    capslock_color = rgb(000000)
    numlock_color = rgb(000000)
    bothlock_color = rgb(000000)
    fail_text = Incorrect password
    fail_timeout = 2000
    monitor =
    size = 200, 24
    outline_thickness = 0
    font_color = rgb(ffffff)
    font_family = Terminus (TTF)
    fade_on_empty = false
    placeholder_text =
    dots_size = 0.6
    dots_spacing = 0.15
    dots_center = false
    dots_text_format = *
    position = 30, -25
    halign = center
    valign = center
}
