general {
    lock_cmd = pidof hyprlock || hyprlock                             # avoid starting multiple hyprlock instances
    before_sleep_cmd = loginctl lock-session                          # lock before suspend (also on lid close)
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})' # turn screen on after resume without a key press
    ignore_dbus_inhibit = false                                       # respect video players / browsers inhibiting idle
    inhibit_sleep = 3                                                 # delay sleep until the session is actually locked
}

# 2.5 min: dim the screen
listener {
    timeout = 150
    on-timeout = brightnessctl -s set 10%
    on-resume = brightnessctl -r
}

# 2.5 min: turn off keyboard backlight
listener {
    timeout = 150
    on-timeout = brightnessctl -sd '*::kbd_backlight' set 0
    on-resume = brightnessctl -rd '*::kbd_backlight'
}

# 5 min: lock
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# 5.5 min: screen off
listener {
    timeout = 330
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

# 30 min: suspend
listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
